<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notify Me — Email List</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #F5F5F7; color: #111827; min-height: 100vh;
    padding: 32px 20px;
  }
  .page { max-width: 860px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  header img { height: 36px; }
  header h1 { font-size: 20px; font-weight: 700; color: #111; }
  header .pill {
    margin-left: auto; font-size: 12px; font-weight: 600;
    background: #EDE9FE; color: #5B21B6; border-radius: 20px; padding: 3px 10px;
  }
  .card {
    background: #fff; border-radius: 14px; padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 20px;
  }
  .auth-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .auth-row input {
    flex: 1; min-width: 200px; border: 1.5px solid #E5E7EB;
    border-radius: 8px; padding: 8px 12px; font-size: 13.5px; outline: none;
  }
  .auth-row input:focus { border-color: #5B21B6; }
  .btn {
    background: linear-gradient(135deg,#5B21B6,#4F46E5);
    color: #fff; border: none; border-radius: 8px;
    padding: 8px 18px; font-size: 13.5px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  .btn:hover { opacity: .88; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-outline {
    background: #fff; color: #5B21B6; border: 1.5px solid #5B21B6;
    border-radius: 8px; padding: 7px 16px; font-size: 13px;
    font-weight: 600; cursor: pointer;
  }
  .btn-outline:hover { background: #F5F3FF; }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; }
  .stat { background: #F9FAFB; border-radius: 10px; padding: 12px 18px; flex: 1; min-width: 120px; }
  .stat-val { font-size: 28px; font-weight: 700; color: #5B21B6; }
  .stat-label { font-size: 11px; color: #6B7280; margin-top: 2px; text-transform: uppercase; letter-spacing: .04em; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .toolbar h2 { font-size: 15px; font-weight: 700; }
  .toolbar-right { display: flex; gap: 8px; align-items: center; }
  .count-label { font-size: 12px; color: #9CA3AF; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th {
    text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .05em;
    text-transform: uppercase; color: #6B7280; padding: 8px 12px;
    border-bottom: 1.5px solid #E5E7EB;
  }
  td { padding: 10px 12px; border-bottom: 1px solid #F3F4F6; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #FAFAFA; }
  .email-cell { font-weight: 500; color: #111; }
  .source-badge {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    background: #EDE9FE; color: #5B21B6; border-radius: 4px;
    padding: 2px 7px; display: inline-block;
  }
  .ts-cell { color: #6B7280; font-size: 12px; white-space: nowrap; }
  .empty { text-align: center; padding: 40px; color: #9CA3AF; font-size: 14px; }
  .load-more-row { text-align: center; padding: 20px 0 4px; }
  #error-msg {
    color: #991B1B; background: #FEF2F2; padding: 10px 14px;
    border-radius: 8px; font-size: 13px; margin-top: 12px; display: none;
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <img src="https://cc.sj-cdn.net/instructor/1n4vvi18nnyfs-appviewx/themes/119fgrg1k6qdg/favicon.1774413970.png" alt="AppViewX" />
    <h1>Notify Me — Email List</h1>
    <span class="pill">Admin</span>
  </header>

  <div class="card" id="auth-card">
    <p style="font-size:13.5px;color:#374151;margin-bottom:14px;">Enter your admin key to view captured email addresses.</p>
    <div class="auth-row">
      <input type="password" id="key-input" placeholder="Admin key" />
      <button class="btn" onclick="loadData(0)">Load</button>
    </div>
    <div id="error-msg"></div>
  </div>

  <div id="data-section" style="display:none;">
    <div class="card">
      <div class="stats" id="stats-row"></div>
    </div>
    <div class="card">
      <div class="toolbar">
        <h2>Certifications waitlist</h2>
        <div class="toolbar-right">
          <span class="count-label" id="count-label"></span>
          <button class="btn-outline" onclick="exportCSV()">⬇ Export CSV</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>#</th><th>Email</th><th>Source</th><th>Date &amp; Time</th>
          </tr>
        </thead>
        <tbody id="list-body"></tbody>
      </table>
      <div id="empty-msg" class="empty" style="display:none;">No email addresses captured yet.</div>
      <div class="load-more-row" id="load-more-row" style="display:none;">
        <button class="btn" id="load-more-btn" onclick="loadMore()">Load more</button>
      </div>
    </div>
  </div>

</div>

<script>
var API_BASE    = 'https://appviewx-skill-assessment.vercel.app/api/notify-list';
var PAGE_SIZE   = 50;
var allEntries  = [];
var totalCount  = 0;
var currentOffset = 0;
var adminKey    = '';

function loadData(offset) {
  var key = document.getElementById('key-input').value.trim();
  if (!key) { showError('Please enter the admin key.'); return; }
  adminKey = key;
  hideError();

  // Fix #3: key in Authorization header, never in URL
  var url = API_BASE + '?source=certifications&offset=' + offset + '&limit=' + PAGE_SIZE;

  fetch(url, { headers: { 'Authorization': 'Bearer ' + key } })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.error) { showError(d.error === 'Unauthorized' ? 'Invalid admin key.' : d.error); return; }
      if (offset === 0) {
        allEntries   = [];
        totalCount   = d.total || 0;
        currentOffset = 0;
        document.getElementById('auth-card').style.display = 'none';
        document.getElementById('data-section').style.display = 'block';
        renderStats(d);
      }
      appendRows(d.entries);
      currentOffset = offset + d.count;
      updatePagination(d);
    })
    .catch(function() { showError('Network error. Please try again.'); });
}

function loadMore() {
  document.getElementById('load-more-btn').disabled = true;
  loadData(currentOffset);
}

function renderStats(d) {
  var today = allEntries.concat(d.entries || []).filter(function(e) {
    return e.ts && e.ts.startsWith(new Date().toISOString().slice(0, 10));
  }).length;

  document.getElementById('stats-row').innerHTML =
    stat(d.total || d.count, 'Total subscribers') +
    stat(today, 'Added today') +
    stat(d.source, 'Source');
}

function appendRows(entries) {
  if (!entries || !entries.length) {
    if (!allEntries.length) document.getElementById('empty-msg').style.display = 'block';
    return;
  }
  document.getElementById('empty-msg').style.display = 'none';

  var startIdx = allEntries.length;
  allEntries = allEntries.concat(entries);

  var body = document.getElementById('list-body');
  body.insertAdjacentHTML('beforeend', entries.map(function(e, i) {
    return '<tr>' +
      '<td style="color:#9CA3AF;font-size:12px;">' + (startIdx + i + 1) + '</td>' +
      '<td class="email-cell">' + esc(e.email || '') + '</td>' +
      '<td><span class="source-badge">' + esc(e.source || 'certifications') + '</span></td>' +
      '<td class="ts-cell">' + formatTs(e.ts) + '</td>' +
      '</tr>';
  }).join(''));
}

function updatePagination(d) {
  var total   = d.total || 0;
  var showing = Math.min(currentOffset, total);
  document.getElementById('count-label').textContent =
    total ? 'Showing ' + showing + ' of ' + total : '';

  var loadMoreRow = document.getElementById('load-more-row');
  var loadMoreBtn = document.getElementById('load-more-btn');
  if (d.hasMore) {
    loadMoreRow.style.display = 'block';
    loadMoreBtn.disabled = false;
    loadMoreBtn.textContent = 'Load more';
  } else {
    loadMoreRow.style.display = 'none';
  }
}

function stat(val, label) {
  return '<div class="stat"><div class="stat-val">' + val + '</div>' +
         '<div class="stat-label">' + label + '</div></div>';
}

function formatTs(ts) {
  if (!ts) return '—';
  var d = new Date(ts);
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) +
         '  ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}

function exportCSV() {
  if (!allEntries.length) return;
  var rows = [['#','Email','Source','Timestamp']];
  allEntries.forEach(function(e, i) {
    rows.push([i + 1, e.email || '', e.source || '', e.ts || '']);
  });
  var csv = rows.map(function(r) {
    return r.map(function(cell) { return '"' + String(cell).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  var blob = new Blob([csv], { type: 'text/csv' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = 'notify-list-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function showError(msg) {
  var el = document.getElementById('error-msg');
  el.textContent = msg; el.style.display = 'block';
}
function hideError() { document.getElementById('error-msg').style.display = 'none'; }

document.getElementById('key-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') loadData(0);
});
</script>
</body>
</html>
